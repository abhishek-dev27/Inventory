# 🌐 NGINX Production Upstream Load Balancer Configuration
# Place in /etc/nginx/conf.d/inventory.conf

upstream inventory_backend_cluster {
    # Load Balancing Algorithms available:
    # 1. Round-Robin (default)
    # 2. least_conn; (routes to instance with lowest active connections)
    # 3. ip_hash; (sticky sessions per client IP)
    least_conn;

    # Backend Node Pool with health failure thresholds
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s backup;
    
    keepalive 32;
}

server {
    listen 80;
    server_name inventory.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name inventory.yourdomain.com;

    # SSL Certificates
    # ssl_certificate /etc/letsencrypt/live/inventory.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/inventory.yourdomain.com/privkey.pem;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # API Load Balancer Proxy
    location /api/ {
        proxy_pass http://inventory_backend_cluster;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }

    # Frontend Static Assets Caching
    location / {
        root /var/www/inventory/client/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
